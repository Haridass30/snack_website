name: RemixSite

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}   # must be ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            cd /home/ubuntu/Web_Pro/snack_website

            echo "📦 Pulling latest code"
            git fetch origin
            git reset --hard origin/main
            git clean -fd

            echo "📦 Installing dependencies"
            pnpm install --frozen-lockfile

            echo "🏗️ Building project"
            pnpm build

            echo "🚀 Restarting PM2"
            if pm2 describe snack > /dev/null; then
              pm2 restart snack
            else
              pm2 start npm --name "snack" -- start
            fi

            pm2 save
